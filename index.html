async function syncToSheets(silent){
  const url = state.meta.sheetsUrl;
  if(!url){ if(!silent) toast('กรุณาใส่ Google Apps Script URL ก่อน'); return; }
  if(!state.meta.syncedOrderIds) state.meta.syncedOrderIds = [];
  if(!state.meta.syncedExpenseIds) state.meta.syncedExpenseIds = [];
  const syncedOrders = new Set(state.meta.syncedOrderIds);
  const syncedExpenses = new Set(state.meta.syncedExpenseIds);
  const ordersToSync = state.orders.filter(o=>o.status==='paid' && !syncedOrders.has(o.id));
  const expensesToSync = state.expenses.filter(e=>!syncedExpenses.has(e.id));
  if(ordersToSync.length===0 && expensesToSync.length===0){
    if(!silent) toast('ไม่มีข้อมูลใหม่ที่ต้องซิงค์ — ส่งไปแล้วทั้งหมด');
    return;
  }
  const today = todayStr();
  const payload = {
    date:today,
    orders: ordersToSync,
    expenses: expensesToSync,
    driveFolderId: state.meta.driveFolderId||"",
    rolePermissions: state.rolePermissions,
    staffAccounts: state.staffAccounts.map(a=>({username:a.username, name:a.name, role:a.role, station:a.station})),
    expenseCategories: state.expenseCategories
  };
  try{
    await fetchWithTimeout(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }, 8000);
    state.meta.syncedOrderIds = [...syncedOrders, ...ordersToSync.map(o=>o.id)];
    state.meta.syncedExpenseIds = [...syncedExpenses, ...expensesToSync.map(e=>e.id)];
    state.meta.lastSyncedAt = new Date().toISOString();
    addAudit(silent? `ซิงค์ข้อมูลอัตโนมัติไปยัง Google Sheet (${ordersToSync.length} ออเดอร์ใหม่, ${expensesToSync.length} บิลใหม่)` : `ส่งออกข้อมูลไปยัง Google Sheet (${ordersToSync.length} ออเดอร์ใหม่, ${expensesToSync.length} บิลใหม่)`);
    saveState();
    if(!silent) toast(`ส่งข้อมูลใหม่ไปยัง Google Sheet แล้ว: ${ordersToSync.length} ออเดอร์, ${expensesToSync.length} บิล (กดซ้ำได้ ไม่ซ้ำข้อมูลแล้ว)`);
    if(activeTab==='admin') renderView();
  }catch(e){ if(!silent) toast('เชื่อมต่อ Google Sheet ไม่สำเร็จ ตรวจสอบ URL หรือการตั้งค่า Deploy'); }
}
async function restoreFromSheets(){
  if(session.role!=='owner'){ toast('เฉพาะเจ้าของร้านเท่านั้นที่กู้คืนข้อมูลได้'); return; }
  const url = state.meta.sheetsUrl;
  if(!url){ toast('กรุณาใส่และบันทึก Apps Script URL ก่อน'); return; }
  toast('กำลังดึงข้อมูลจาก Google Sheet...');
  try{
    const res = await fetchWithTimeout(url, { method:'GET' }, 10000);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    let addedOrders = 0, addedBills = 0;
    const existingOrderIds = new Set(state.orders.map(o=>o.id));
    const existingBillIds = new Set(state.expenses.map(b=>b.id));
    let maxNo = state.nextOrderNo - 1;
    (data.orders||[]).forEach(o=>{
      if(!o.id || existingOrderIds.has(o.id)) return;
      const ts = o.paidAt || (o.date? o.date+'T00:00:00.000Z' : new Date().toISOString());
      state.orders.push({
        id:o.id, no:+o.no||0, tableId:o.tableId||null, channel:o.channel||'หน้าร้าน', memberId:null,
        items: Array.isArray(o.items)? o.items : [], discount:{type:'none',value:0,code:null},
        status:'paid', source:'restored', payMethod:o.payMethod||'', total:+o.total||0,
        createdAt:ts, paidAt:ts, role:null
      });
      addedOrders++;
      if(+o.no > maxNo) maxNo = +o.no;
    });
    (data.expenses||[]).forEach(b=>{
      if(!b.id || existingBillIds.has(b.id)) return;
      state.expenses.push({
        id:b.id, date:b.date, time:b.time||'', supplierId:null, vendorNote:b.vendorNote||'', receiptImage:'',
        lines:(b.lines||[]).map((l,i)=>({id:b.id+'-l'+i, category:l.category, item:l.item, qty:+l.qty||0, unit:l.unit, unitPrice:+l.unitPrice||0, total:+l.total||0})),
        total:+b.total||0
      });
      addedBills++;
    });
    if(maxNo >= state.nextOrderNo) state.nextOrderNo = maxNo+1;
    if(!state.meta.syncedOrderIds) state.meta.syncedOrderIds = [];
    if(!state.meta.syncedExpenseIds) state.meta.syncedExpenseIds = [];
    state.meta.syncedOrderIds = [...new Set([...state.meta.syncedOrderIds, ...(data.orders||[]).map(o=>o.id).filter(Boolean)])];
    state.meta.syncedExpenseIds = [...new Set([...state.meta.syncedExpenseIds, ...(data.expenses||[]).map(b=>b.id).filter(Boolean)])];
    addAudit(`กู้คืนข้อมูลจาก Google Sheet: ${addedOrders} ออเดอร์, ${addedBills} บิลรายจ่าย`);
    await saveState();
    toast(addedOrders||addedBills ? `กู้คืนสำเร็จ: เพิ่ม ${addedOrders} ออเดอร์ และ ${addedBills} บิลที่ขาดหายไป` : 'ไม่มีข้อมูลใน Sheet ที่ขาดหายจากในแอป');
    renderView();
  }catch(e){
    toast('ดึงข้อมูลจาก Google Sheet ไม่สำเร็จ — ตรวจสอบว่า Deploy เวอร์ชันล่าสุด (ที่รองรับ GET) แล้ว หรือลองเปิด URL นี้ตรงในเบราว์เซอร์ดูว่าได้ JSON กลับมาไหม');
  }
}
function startAutoSyncTimer(){
  stopAutoSyncTimer();
  if(STORAGE_MODE==='sheets') return; // already live on Sheets directly; the row-export sync is redundant here
  if(state.meta.autoSync && state.meta.autoSync.enabled && state.meta.sheetsUrl){
    const ms = Math.max(5, state.meta.autoSync.intervalMinutes) * 60 * 1000;
    autoSyncTimer = setInterval(()=>syncToSheets(true), ms);
  }
}
function stopAutoSyncTimer(){
  if(autoSyncTimer) clearInterval(autoSyncTimer);
  autoSyncTimer = null;
}

function getManifestData(){
  try{
    const href = document.querySelector('link[rel="manifest"]').href;
    const base64 = href.split(',')[1];
    return JSON.parse(atob(base64));
  }catch(e){ return null; }
}
function downloadDataUri(dataUri, filename){
  const a = document.createElement('a'); a.href=dataUri; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
}

function openSupplierModal(existing, onSaved){
  const s = existing || {id:null, name:'', address:'', phone:''};
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>${existing? 'แก้ไขผู้จำหน่าย':'เพิ่มผู้จำหน่ายใหม่'}</h3>
    <div class="field"><label>ชื่อผู้จำหน่าย/ร้านค้า</label><input id="spName" value="${s.name}"></div>
    <div class="field"><label>ที่อยู่</label><input id="spAddress" value="${s.address}"></div>
    <div class="field"><label>เบอร์โทร</label><input id="spPhone" value="${s.phone}"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cancelSp">ยกเลิก</button><button class="btn btn-primary" id="saveSp">บันทึก</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelSp').onclick = ()=>overlay.remove();
  overlay.querySelector('#saveSp').onclick = ()=>{
    const name = overlay.querySelector('#spName').value.trim();
    if(!name){ toast('กรุณาใส่ชื่อผู้จำหน่าย'); return; }
    const data = { name, address:overlay.querySelector('#spAddress').value.trim(), phone:overlay.querySelector('#spPhone').value.trim() };
    let saved;
    if(existing){ Object.assign(existing, data); saved = existing; addAudit(`แก้ไขผู้จำหน่าย: ${name}`); }
    else { saved = {id:'sup'+Date.now(), ...data}; state.suppliers.push(saved); addAudit(`เพิ่มผู้จำหน่ายใหม่: ${name}`); }
    saveState(); overlay.remove();
    if(onSaved) onSaved(saved); else renderView();
  };
}

  if(adminSub==='printer') bindAdminPrinterEvents();
  if(adminSub==='expcat') bindAdminExpenseCatEvents();
  if(adminSub==='mobileapp') bindAdminMobileAppEvents();
  if(adminSub==='stations') bindAdminStationsEvents();
  if(adminSub==='theme') bindAdminThemeEvents();
  if(adminSub==='suppliers') bindAdminSuppliersEvents();
  if(adminSub==='perms' && session.role==='owner') bindAdminPermsEvents();
}

/* ============================= BIND ============================= */
function bindViewEvents(){
  const t = activeTab;
  if(t==='pos') bindPOSEvents();
  if(t==='tables') bindTablesEvents();
  if(t==='kitchen') bindKitchenEvents();
  if(t==='menu') bindMenuEvents();
  if(t==='stock') bindStockEvents();
  if(t==='promo') bindPromoEvents();
  if(t==='members') bindMembersEvents();
  if(t==='dashboard') bindDashboardEvents();
  if(t==='analytics') bindAnalyticsEvents();
  if(t==='expenses') bindExpensesEvents();
  if(t==='closing') bindClosingEvents();
  if(t==='admin') bindAdminEvents();
}

/* ============================= POLLING (multi-screen sync) ============================= */
function startPolling(){ stopPolling(); const ms = STORAGE_MODE==='sheets' ? 9000 : 4000; pollTimer = setInterval(refreshFromShared, ms); }
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }

/* ============================= CUSTOMER SELF-ORDER PAGE (public, no login — reached via table QR) ============================= */
let customerCart = [];
let customerCatFilter = "ทั้งหมด";
function customerCartLineTotal(line){ return cartLineTotal(line); }
function renderCustomerOrderPage(tableId){
  const app = document.getElementById('app');
  const t = state.tables.find(x=>x.id===tableId);
  if(!t){
    app.innerHTML = `<div class="login-wrap"><div class="login-card"><div class="login-mark">🔗</div><h2>ไม่พบโต๊ะนี้</h2><p class="lede" style="color:var(--ink-soft); font-size:13px;">ลิงก์ QR อาจไม่ถูกต้องหรือหมดอายุ กรุณาเรียกพนักงาน</p></div></div>`;
    return;
  }
  const cats = ["ทั้งหมด", ...new Set(state.products.filter(p=>p.status==='ขาย').map(p=>p.category))];
  const prods = state.products.filter(p=>p.status==='ขาย' && (customerCatFilter==='ทั้งหมด'||p.category===customerCatFilter));
  const total = customerCart.reduce((s,l)=>s+customerCartLineTotal(l),0);
  const qtySum = customerCart.reduce((s,l)=>s+l.qty,0);
  app.innerHTML = `
  <div style="max-width:640px; margin:0 auto; min-height:100vh; background:var(--cream); display:flex; flex-direction:column;">
    <div style="background:var(--broth-deep); color:#fff; padding:18px; text-align:center; position:sticky; top:0; z-index:5;">
      <div style="font-weight:700; font-size:17px;">${state.shopSettings.name||'ร้านค้า'}</div>
      <div style="font-size:13px; opacity:.85; margin-top:2px;">สั่งอาหารที่ ${t.name}</div>
      ${t.pendingSelfOrder? `<div style="margin-top:8px; background:rgba(255,255,255,0.15); border-radius:8px; padding:8px 10px; font-size:12px; text-align:left;">
        <div style="font-weight:700; margin-bottom:4px;">คุณมีออเดอร์ที่ส่งไปแล้ว กำลังรอพนักงานยืนยัน:</div>
        ${t.pendingSelfOrder.items.map(l=>{ const p=state.products.find(x=>x.id===l.pid); return `<div>• ${p?p.name:'-'} × ${l.qty}</div>`; }).join('')}
      </div>`:''}
    </div>
    <div class="cat-row" style="padding:12px 14px 0;">${cats.map(c=>`<button class="cat-chip ${c===customerCatFilter?'active':''}" data-custcat="${c}">${c}</button>`).join('')}</div>
    <div style="flex:1; padding:10px 14px 150px;">
      <div class="prod-grid" ${(state.menuGridColsCustomer||0)>0?`style="grid-template-columns:repeat(${state.menuGridColsCustomer},1fr);"`:''}>${prods.map(p=>`
        <button class="prod-tile" data-custadd="${p.id}">
          <div class="prod-thumb" ${prodThumb(p)}>${p.image?'':'🍜'}</div>
          <div class="prod-body"><div class="pname">${p.name}</div><div class="pprice mono">฿${fmt(p.price)}</div></div>
        </button>`).join('')}</div>
      ${customerCart.length? `
        <div class="section-title" style="margin-top:18px;">รายการที่เลือก</div>
        <div class="panel">${customerCart.map((l,i)=>{
          const p = state.products.find(x=>x.id===l.pid);
          return `<div class="cart-item"><div class="ci-top"><span>${p? p.name:'-'}</span><span class="mono">฿${fmt(customerCartLineTotal(l))}</span></div>
          <div class="ci-row"><div class="qty-ctl"><button data-custqty="-1" data-idx="${i}">−</button><span class="mono">${l.qty}</span><button data-custqty="1" data-idx="${i}">+</button></div></div></div>`;
        }).join('')}</div>`:''}
    </div>
    <div style="position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 14px; box-shadow:0 -4px 16px rgba(23,32,51,0.08);">
      <div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:8px;"><span>รวม (${qtySum} รายการ)</span><span class="mono">฿${fmt(total)}</span></div>
      <button class="btn btn-primary" style="width:100%;" id="custSubmit" ${customerCart.length===0?'disabled':''}>ส่งคำสั่งซื้อ</button>
    </div>
  </div>`;
  bindCustomerPageEvents(t);
}
function bindCustomerPageEvents(t){
  document.querySelectorAll('[data-custcat]').forEach(b=>b.onclick=()=>{ customerCatFilter=b.dataset.custcat; renderCustomerOrderPage(t.id); });
  document.querySelectorAll('[data-custadd]').forEach(b=>b.onclick=()=>{
    const pid = b.dataset.custadd;
    const ex = customerCart.find(l=>l.pid===pid && (!l.opts||l.opts.length===0));
    if(ex) ex.qty+=1; else customerCart.push({pid, qty:1, opts:[], note:""});
    renderCustomerOrderPage(t.id);
  });
  document.querySelectorAll('[data-custqty]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.idx; customerCart[i].qty += (+b.dataset.custqty); if(customerCart[i].qty<=0) customerCart.splice(i,1);
    renderCustomerOrderPage(t.id);
  });
  const submitBtn = document.getElementById('custSubmit');
  if(submitBtn) submitBtn.onclick = async ()=>{
    if(customerCart.length===0) return;
    submitBtn.disabled = true; submitBtn.textContent = 'กำลังส่ง...';
    const table = state.tables.find(x=>x.id===t.id);
    const existing = table.pendingSelfOrder;
    const justOrdered = JSON.parse(JSON.stringify(customerCart));
    table.pendingSelfOrder = { items: existing? existing.items.concat(justOrdered) : justOrdered, createdAt:new Date().toISOString() };
    await saveState();
    customerCart = [];
    const orderedTotal = justOrdered.reduce((s,l)=>s+cartLineTotal(l),0);
    const app = document.getElementById('app');
    app.innerHTML = `<div class="login-wrap"><div class="login-card">
      <div class="login-mark">✓</div>
      <h2>ส่งคำสั่งซื้อแล้ว</h2>
      <p class="lede" style="color:var(--ink-soft); font-size:13px;">รอพนักงานยืนยันออเดอร์ที่ ${table.name} สักครู่</p>
      <div style="text-align:left; margin-top:14px; border-top:1px dashed var(--line); padding-top:10px;">
        ${justOrdered.map(l=>{
          const p = state.products.find(x=>x.id===l.pid);
          return `<div style="display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;"><span>${p?p.name:'-'} × ${l.qty}</span><span class="mono">฿${fmt(cartLineTotal(l))}</span></div>`;
        }).join('')}
        <div style="display:flex; justify-content:space-between; font-weight:700; border-top:1px dashed var(--line); margin-top:6px; padding-top:6px;"><span>รวม</span><span class="mono">฿${fmt(orderedTotal)}</span></div>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="location.reload()">สั่งเพิ่ม</button>
    </div></div>`;
  };
}

/* ============================= INIT ============================= */
(async function init(){
  await loadSharedState();
  applyTheme(state.themeName);
  const qrTable = new URLSearchParams(window.location.search).get('table');
  if(qrTable){ renderCustomerOrderPage(qrTable); if(STORAGE_MODE==='claude'||STORAGE_MODE==='sheets') setInterval(async ()=>{ try{ const res=await storageGet('pos-shared-state', true); if(res&&res.value){ state=JSON.parse(res.value); migrateState(); applyTheme(state.themeName); } }catch(e){} }, STORAGE_MODE==='sheets'?9000:8000); return; }
  await tryAutoLogin();
  render();
  if(session){ startPolling(); startAutoSyncTimer(); }
  setInterval(()=>{ const c=document.getElementById('clock'); if(c) c.textContent=nowTime(); }, 15000);
})();
</script>
