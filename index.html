<style>
  :root{
    --cream:#F7F9FC; --cream-deep:#EEF2FA; --broth:#1677FF; --broth-deep:#172033;
    --chili:#F04438; --chili-deep:#B42318; --gold:#18BFFF; --herb:#12B76A; --warn:#F79009;
    --ink:#172033; --ink-soft:#667085; --line:#E5EAF2; --paper:#FFFFFF; --blue:#1455D9;
    --radius:10px; --shadow:0 2px 10px rgba(23,32,51,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; font-family:'Prompt', system-ui, -apple-system, sans-serif; background:var(--cream); color:var(--ink); font-size:16px;}
  .mono{font-family:'SFMono-Regular',Consolas,monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}

  #app{display:flex; height:100vh; overflow:hidden;}

  /* ===== Login ===== */
  .login-wrap{width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--broth-deep),var(--broth) 60%, var(--gold));}
  .login-card{background:var(--paper); border-radius:16px; padding:32px 30px; width:360px; max-width:90vw; box-shadow:0 12px 40px rgba(0,0,0,0.35);}
  .login-mark-img{width:64px; height:64px; object-fit:contain; margin:0 auto 10px; display:block;}
  .login-tagline{text-align:center; font-size:11.5px; font-weight:700; letter-spacing:0.04em; color:var(--gold); text-transform:uppercase; margin-bottom:18px;}
  .login-card h2{text-align:center; margin:0 0 2px; color:var(--broth-deep);}
  .login-card .lede{text-align:center; margin:0 0 20px;}
  .login-err{background:#fbe6e0; color:var(--chili-deep); font-size:12.5px; padding:8px 10px; border-radius:6px; margin-bottom:10px;}
  .remember-row{display:flex; align-items:center; gap:8px; font-size:13px; margin:6px 0 16px;}

  /* ===== Sidebar ===== */
  .sidebar{width:96px; background:var(--broth-deep); color:var(--cream); display:flex; flex-direction:column; align-items:stretch; flex-shrink:0; padding:14px 0; overflow-y:auto;}
  .brand{text-align:center; padding:0 8px 16px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:10px;}
  .brand-mark-img{width:38px; height:38px; object-fit:contain; margin:0 auto 6px; display:block;}
  .brand-name{font-size:12.5px; font-weight:700; line-height:1.3;}
  .navbtn{display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:rgba(251,245,234,0.62); padding:10px 4px; margin:1px 8px; border-radius:8px; font-size:11px; font-weight:500; transition:background .15s,color .15s;}
  .navbtn .ic{font-size:18px;}
  .navbtn:hover{background:rgba(255,255,255,0.06); color:var(--cream);}
  .navbtn.active{background:var(--broth); color:#fff;}
  .logoutbtn{margin:8px 8px 0; padding:9px 4px; border-radius:8px; background:rgba(255,255,255,0.08); border:none; color:var(--cream); font-size:11px; font-weight:600;}

  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{height:56px; flex-shrink:0; background:var(--paper); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 20px;}
  .topbar h1{font-size:17px; margin:0; font-weight:700; color:var(--broth-deep);}
  .topbar .sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .top-right{display:flex; align-items:center; gap:12px;}
  .clock{font-size:13px; color:var(--ink-soft);}
  .who{display:flex; align-items:center; gap:8px; background:var(--cream-deep); padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600; color:var(--broth-deep);}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
  .drawer-pill{display:flex; align-items:center; gap:6px; font-size:12px; padding:6px 10px; border-radius:16px; border:1px solid var(--line); background:var(--paper); cursor:pointer;}
  .drawer-pill .dd{width:8px;height:8px;border-radius:50%; background:var(--ink-soft);}
  .drawer-pill.open .dd{background:var(--herb);}

  .view{flex:1; overflow-y:auto; padding:18px 22px 40px;}
  .view h2{margin:0 0 4px; font-size:20px; color:var(--broth-deep);}
  .view .lede{color:var(--ink-soft); font-size:13px; margin:0 0 16px;}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .notice{background:#fdf1de; border:1px solid #ecd6a6; color:#7a5a1e; font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:14px;}

  /* ===== POS ===== */
  .pos-layout{display:grid; grid-template-columns:1fr 340px; gap:16px; height:100%;}
  .cat-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .cat-chip{padding:7px 16px; border-radius:20px; border:1px solid var(--line); background:var(--paper); font-size:13px; font-weight:600; color:var(--ink-soft);}
  .cat-chip.active{background:var(--broth); border-color:var(--broth); color:#fff;}
  .cat-divider{font-size:13px; font-weight:700; color:var(--broth-deep); margin:14px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--line);}
  .cat-divider:first-child{margin-top:0;}
  .prod-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px;}
  .prod-tile{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:0; text-align:left; display:flex; flex-direction:column; overflow:hidden; min-height:160px;}
  .prod-tile:hover{border-color:var(--gold);}
  .prod-thumb{width:100%; height:104px; background:var(--cream-deep) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--ink-soft);}
  .prod-body{padding:8px 10px 10px; display:flex; flex-direction:column; gap:4px; flex:1;}
  .prod-tile .pname{font-weight:600; font-size:13px; line-height:1.3;}
  .prod-tile .pprice{color:var(--broth); font-weight:700; font-size:13.5px; margin-top:auto;}
  .prod-tile.out{opacity:.45;}
  .prod-tile.out .pprice::after{content:" · หมด"; color:var(--ink-soft); font-weight:500; font-size:11px;}

  .cart{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column; overflow:hidden;}
  .cart-head{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .cart-head select{border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:13px;}
  .cart-items{flex:1; overflow-y:auto; padding:8px 14px;}
  .cart-item{padding:9px 0; border-bottom:1px dashed var(--line);}
  .ci-top{display:flex; justify-content:space-between; font-size:13.5px; font-weight:600;}
  .ci-opts{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .ci-row{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .qty-ctl{display:flex; align-items:center; gap:8px;}
  .qty-ctl button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--cream-deep);font-weight:700;}
  .ci-remove{color:var(--chili); font-size:11.5px; background:none; border:none; text-decoration:underline;}
  .cart-foot{border-top:1px solid var(--line); padding:12px 14px; background:var(--cream-deep);}
  .cf-row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--ink-soft);}
  .cf-total{display:flex; justify-content:space-between; font-size:17px; font-weight:700; color:var(--broth-deep); margin:8px 0;}
  .cf-actions{display:flex; gap:8px; margin-top:8px;}
  .btn{border:none; border-radius:8px; padding:10px 14px; font-weight:700; font-size:13.5px;}
  .btn-primary{background:var(--broth); color:#fff; flex:1;}
  .btn-secondary{background:var(--broth); color:#fff; flex:1;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink-soft);}
  .btn-small{padding:6px 10px; font-size:12px; border-radius:6px;}
  select.mini, input.mini{border:1px solid var(--line); border-radius:6px; padding:5px 7px; font-size:12.5px;}
  .cash-quick{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
  .cash-quick button{border:1px solid var(--line); background:var(--cream-deep); border-radius:6px; padding:6px 10px; font-size:12.5px; font-weight:700;}
  .change-box{border-radius:12px; padding:14px 16px; text-align:center; margin:10px 0 4px; transition:background .15s;}
  .change-box:empty{padding:0; margin:0;}
  .change-box .change-label{font-size:13px; font-weight:700; letter-spacing:0.02em;}
  .change-box .change-amount{font-size:38px; font-weight:800; line-height:1.15; margin-top:2px;}
  .change-box.change-ok{background:#e4f3e1;}
  .change-box.change-ok .change-label{color:var(--herb);}
  .change-box.change-ok .change-amount{color:#2f5e28;}
  .change-box.change-short{background:#fbe2de;}
  .change-box.change-short .change-label{color:var(--chili-deep);}
  .change-box.change-short .change-amount{color:var(--chili-deep);}

  /* ===== Tables ===== */
  .table-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
  .table-card{border-radius:var(--radius); padding:14px 10px; text-align:center; border:1px solid var(--line); background:var(--paper); position:relative;}

/* ============================= STORAGE ABSTRACTION =============================
   Tries Claude's built-in storage first (works when this file is opened through
   Claude — chat preview or a published artifact link). If that API doesn't exist
   (opened as a plain downloaded file, or hosted on your own server), it falls
   back to the browser's localStorage so data still survives closing and
   reopening the page on THIS device. localStorage never syncs across different
   devices/browsers on its own — only the Claude-storage mode does that. If even
   localStorage is blocked (e.g. private/incognito mode with storage disabled),
   it falls back to in-memory only and shows a warning banner. */
let STORAGE_MODE = 'unknown';
let BACKEND_URL = null;
let _sheetsWriteFailStreak = 0;
function detectStorageMode(){
  try{
    const backendParam = new URLSearchParams(window.location.search).get('backend');
    if(backendParam){ localStorage.setItem('pospro_backend_url', backendParam); }
  }catch(e){}
  try{
    const saved = localStorage.getItem('pospro_backend_url');
    if(saved){ BACKEND_URL = saved; STORAGE_MODE='sheets'; return; }
  }catch(e){}
  try{ if(window.storage && typeof window.storage.get==='function'){ STORAGE_MODE='claude'; return; } }catch(e){}
  try{ localStorage.setItem('__pospro_test__','1'); localStorage.removeItem('__pospro_test__'); STORAGE_MODE='local'; return; }catch(e){}
  STORAGE_MODE='memory';
}
function stripHeavyFieldsForSync(s){
  const clone = JSON.parse(JSON.stringify(s));
  if(clone.shopSettings) clone.shopSettings.logo = '';
  if(clone.products) clone.products.forEach(p=>{ p.image=''; });
  if(clone.stock) clone.stock.forEach(x=>{ x.image=''; });
  if(clone.expenses) clone.expenses.forEach(b=>{ b.receiptImage=''; });
  if(clone.orders) clone.orders.forEach(o=>{ if(o.paymentProofImage) o.paymentProofImage=''; });
  return clone;
}
let _memoryStore = {};
function _localKey(key, shared){ return (shared?'pospro_shared_':'pospro_personal_')+key; }
async function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms||8000);
  try{ return await fetch(url, {...(opts||{}), signal: ctrl.signal}); }
  finally{ clearTimeout(timer); }
}
async function storageGet(key, shared){
  if(STORAGE_MODE==='sheets'){
    if(key!=='pos-shared-state') { // session/remember-me stays device-local even in sheets mode
      const raw = localStorage.getItem(_localKey(key, shared)); return raw===null ? null : { key, value:raw, shared };
    }
    try{
      const res = await fetchWithTimeout(BACKEND_URL + (BACKEND_URL.includes('?')?'&':'?') + 'type=state', {}, 8000);
      const data = await res.json();
      return data.state ? { key, value:data.state, shared } : null;
    }catch(e){ console.error('sheets read failed', e); return null; }
  }
  if(STORAGE_MODE==='claude'){ return await window.storage.get(key, shared); }
  if(STORAGE_MODE==='local'){
    const raw = localStorage.getItem(_localKey(key, shared));
    return raw===null ? null : { key, value:raw, shared };
  }
  const k = _localKey(key, shared);
  return _memoryStore[k]!==undefined ? { key, value:_memoryStore[k], shared } : null;
}
async function storageSet(key, value, shared){
  if(STORAGE_MODE==='sheets'){
    if(key!=='pos-shared-state'){ localStorage.setItem(_localKey(key, shared), value); return { key, value, shared }; }
    try{
      const stripped = JSON.stringify(stripHeavyFieldsForSync(JSON.parse(value)));
      await fetchWithTimeout(BACKEND_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'saveAppState', stateJson: stripped }) }, 8000);
      _sheetsWriteFailStreak = 0;
    }catch(e){
      console.error('sheets write failed', e);
      _sheetsWriteFailStreak++;
      if(_sheetsWriteFailStreak===3) toast('⚠️ บันทึกข้อมูลไป Google Sheet ไม่สำเร็จหลายครั้งติดกัน ตรวจสอบการเชื่อมต่อ/โควตา');
    }
    return { key, value, shared };
  }
  if(STORAGE_MODE==='claude'){ return await window.storage.set(key, value, shared); }
  if(STORAGE_MODE==='local'){ localStorage.setItem(_localKey(key, shared), value); return { key, value, shared }; }
  _memoryStore[_localKey(key, shared)] = value; return { key, value, shared };
}
async function storageDelete(key, shared, version){
  if(STORAGE_MODE==='sheets'){ localStorage.removeItem(_localKey(key, shared)); return { key, deleted:true, shared }; }
  if(STORAGE_MODE==='claude'){ return await window.storage.delete(key, version); }
  if(STORAGE_MODE==='local'){ localStorage.removeItem(_localKey(key, shared)); return { key, deleted:true, shared }; }
  delete _memoryStore[_localKey(key, shared)]; return { key, deleted:true, shared };
}
function showStorageWarningIfNeeded(){
  if(STORAGE_MODE!=='memory') return;
  if(document.getElementById('storageWarnBanner')) return;
  const el = document.createElement('div');

  el.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:500; background:var(--chili); color:#fff; text-align:center; padding:8px 14px; font-size:12.5px; font-weight:600;';

async function loadSharedState(){
  detectStorageMode();

    const res = await storageGet('pos-shared-state', true);
    if(res && res.value){ state = JSON.parse(res.value); migrateState(); stateVersion="loaded"; showStorageWarningIfNeeded(); return; }
    if(STORAGE_MODE==='sheets') console.warn('Sheets mode: no existing state found on the sheet — starting fresh (or the sheet is genuinely empty).');
  }catch(e){
    if(STORAGE_MODE==='sheets') console.error('Sheets mode: reading state failed, starting fresh locally', e);

  await saveState();

  if(STORAGE_MODE==='sheets'){
    setTimeout(()=>toast('⚠️ ไม่พบข้อมูลบน Google Sheet หรืออ่านไม่สำเร็จ — เริ่มด้วยข้อมูลเปล่าใหม่ ถ้าไม่ใช่การใช้งานครั้งแรก ไปตรวจสอบที่ตั้งค่า → Google Sheet → ทดสอบการเชื่อมต่อ'), 800);

}

  state.updatedAt = Date.now();

  catch(e){

}
let _refreshInFlight = false;
async function refreshFromShared(){
  if(STORAGE_MODE!=='claude' && STORAGE_MODE!=='sheets') return; // local/memory modes are single-device only; nothing external to pull
  if(document.querySelector('.overlay')) return; // don't yank state while a modal is open
  if(_refreshInFlight) return; // previous poll hasn't finished yet (slow network) — skip this tick instead of piling up requests
  _refreshInFlight = true;
  try{
    const res = await storageGet('pos-shared-state', true);
    if(res && res.value){
      const fresh = JSON.parse(res.value);
      if(fresh.updatedAt !== state.updatedAt){ state = fresh; migrateState(); applyTheme(state.themeName); renderView(); }
    }
  }catch(e){}
  finally{ _refreshInFlight = false; }
}

/* ============================= PROMPTPAY QR (Thai QR Payment / EMV spec) ============================= */
function crc16ccitt(str){
  let crc = 0xFFFF;
  for(let c=0;c<str.length;c++){
    crc ^= str.charCodeAt(c) << 8;
    for(let i=0;i<8;i++){
      crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) : (crc<<1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function ppTlv(id, value){ return id + String(value.length).padStart(2,'0') + value; }
function generatePromptPayPayload(target, amount){
  const digits = (target||'').replace(/[^0-9]/g,'');
  if(!digits) return null;
  let proxyType, proxyValue;
  if(digits.length===13){ proxyType='02'; proxyValue=digits; }
  else{
    let phone = digits.startsWith('0') ? digits.substring(1) : digits;
    proxyType='01'; proxyValue='0066'+phone;
  }
  const merchantInfo = ppTlv('00','A000000677010111') + ppTlv(proxyType, proxyValue);
  let payload = '';
  payload += ppTlv('00','01');
  payload += ppTlv('01', amount? '12':'11');
  payload += ppTlv('29', merchantInfo);
  payload += ppTlv('53','764');
  if(amount) payload += ppTlv('54', Number(amount).toFixed(2));
  payload += ppTlv('58','TH');
  payload += '6304';
  return payload + crc16ccitt(payload);
}
function promptpayQrImg(amount, size){
  const id = state.bankAccount && state.bankAccount.promptpayId;
  if(!id) return null;
  const payload = generatePromptPayPayload(id, amount);
  if(!payload) return null;
  return `https://api.qrserver.com/v1/create-qr-code/?size=${size||200}x${size||200}&data=${encodeURIComponent(payload)}`;
}

function decodeJwt(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return null; }
}

  document.getElementById('liPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('showRegister').onclick = openRegisterModal;
  renderGoogleButton('googleSignInBtn', handleGoogleLoginCredential);
}
async function handleGoogleLoginCredential(resp){
  const payload = decodeJwt(resp.credential);
  if(!payload || !payload.email){ renderLogin('เข้าสู่ระบบด้วย Google ไม่สำเร็จ'); return; }
  const acc = state.staffAccounts.find(a=>a.googleEmail===payload.email);
  if(!acc){ openRegisterModal({email:payload.email, name:payload.name||''}); return; }
  session = {...acc};
  kitchenStation = acc.station || null;
  const remember = false;
  await saveSession(remember);
  addAudit(`เข้าสู่ระบบด้วย Google (${payload.email})`);
  await saveState();
  render();
  startPolling(); startAutoSyncTimer();
}
function openRegisterModal(googlePrefill){
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>ลงทะเบียนผู้ใช้ใหม่</h3>
    ${googlePrefill? `<div class="notice">กำลังลงทะเบียนด้วยบัญชี Google: <b>${googlePrefill.email}</b> — ไม่พบบัญชีที่ผูกกับอีเมลนี้ กรอกข้อมูลด้านล่างเพื่อสร้างบัญชีใหม่ (ยังตั้งรหัสผ่านของตัวเองได้ตามปกติ)</div>` : `<div id="googleSignInBtnReg" style="display:flex; justify-content:center; margin-bottom:12px;"></div>
    <div style="display:flex; align-items:center; gap:10px; margin:4px 0 14px;"><div style="flex:1; border-top:1px solid var(--line);"></div><span style="font-size:11.5px; color:var(--ink-soft);">หรือกรอกข้อมูลเอง</span><div style="flex:1; border-top:1px solid var(--line);"></div></div>`}
    <div class="field"><label>ชื่อ-นามสกุล</label><input id="regName" value="${googlePrefill?googlePrefill.name:''}"></div>
    <div class="field"><label>ชื่อผู้ใช้</label><input id="regUser" autocomplete="username" value="${googlePrefill?googlePrefill.email:''}"></div>
    <div class="field"><label>รหัสผ่าน</label><input id="regPass" type="password" autocomplete="new-password"></div>
    <div class="field"><label>ยืนยันรหัสผ่าน</label><input id="regPass2" type="password"></div>
    <div class="field"><label>บทบาท</label>
      <select id="regRole">
        <option value="cashier">แคชเชียร์</option>
        <option value="kitchen">ครัว</option>
        <option value="manager">ผู้จัดการ</option>
      </select>
    </div>
    <div class="field" id="regStationField"><label>สถานีครัว</label>
      <select id="regStation">${Object.entries(stationsMap()).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    </div>
    <p class="hint">บัญชีเจ้าของร้านต้องสร้างโดยเจ้าของร้านเดิมผ่านหน้า "ตั้งค่า/พนักงาน" เท่านั้น เพื่อความปลอดภัยจึงลงทะเบียนเองไม่ได้</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelReg">ยกเลิก</button>
      <button class="btn btn-primary" id="submitReg">ลงทะเบียน</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const roleSel = overlay.querySelector('#regRole');
  const stationField = overlay.querySelector('#regStationField');
  function syncStation(){ stationField.style.display = roleSel.value==='kitchen' ? 'flex' : 'none'; }
  roleSel.onchange = syncStation; syncStation();
  overlay.querySelector('#cancelReg').onclick = ()=>overlay.remove();
  if(!googlePrefill) renderGoogleButton('googleSignInBtnReg', async (resp)=>{
    const payload = decodeJwt(resp.credential);
    if(!payload || !payload.email){ toast('อ่านข้อมูลบัญชี Google ไม่สำเร็จ'); return; }
    if(state.staffAccounts.find(a=>a.googleEmail===payload.email)){ overlay.remove(); toast('อีเมลนี้มีบัญชีอยู่แล้ว กรุณาเข้าสู่ระบบด้วย Google จากหน้าล็อกอิน'); renderLogin(); return; }
    overlay.remove();
    openRegisterModal({email:payload.email, name:payload.name||''});
  });
  overlay.querySelector('#submitReg').onclick = async ()=>{
    const name = overlay.querySelector('#regName').value.trim();
    const role = roleSel.value;
    const username = overlay.querySelector('#regUser').value.trim();
    const pass = overlay.querySelector('#regPass').value;
    const pass2 = overlay.querySelector('#regPass2').value;
    if(!name || !username || !pass){ toast('กรุณากรอกข้อมูลให้ครบ'); return; }
    if(pass.length < 6){ toast('รหัสผ่านควรมีอย่างน้อย 6 ตัวอักษร'); return; }
    if(pass !== pass2){ toast('รหัสผ่านยืนยันไม่ตรงกัน'); return; }
    if(state.staffAccounts.find(a=>a.username===username)){ toast('ชื่อผู้ใช้นี้มีอยู่แล้ว กรุณาใช้ชื่ออื่น'); return; }
    const newAcc = { id:'u'+Date.now(), username, password:pass, role, name, station: role==='kitchen'? overlay.querySelector('#regStation').value : null, googleEmail: googlePrefill? googlePrefill.email : null };
    state.staffAccounts.push(newAcc);
    session = {...newAcc};
    kitchenStation = newAcc.station || null;
    addAudit(`ลงทะเบียนผู้ใช้ใหม่ด้วยตนเอง (${username})${googlePrefill?' ผ่าน Google':''}`);
    await saveState();
    overlay.remove();
    render();
    startPolling();
    toast('ลงทะเบียนสำเร็จ เข้าสู่ระบบแล้ว');
  };
}
async function doLogin(){
  const u = document.getElementById('liUser').value.trim();
  const p = document.getElementById('liPass').value;
  const remember = document.getElementById('liRemember').checked;
  const acc = state.staffAccounts.find(a=>a.username===u && a.password===p);
  if(!acc){ renderLogin("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"); return; }
  session = {...acc};
  kitchenStation = acc.station || null;
  await saveSession(remember);
  if(!remember) await clearRememberedSession();
  addAudit(`เข้าสู่ระบบ (${acc.username})`);
  render(); // show the app immediately — never make login wait on a network save that could hang
  startPolling();
  startAutoSyncTimer();
  saveState(); // fire-and-forget in the background
}
async function doLogout(){
  addAudit(`ออกจากระบบ (${session.username})`);
  await saveState();
  await clearRememberedSession();
  session = null;
  stopPolling();
  stopAutoSyncTimer();
  render();
}

function renderView(){
  const v = document.getElementById('view');
  const map = {pos:viewPOS, tables:viewTables, kitchen:viewKitchen, menu:viewMenu, stock:viewStock, promo:viewPromo, members:viewMembers, dashboard:viewDashboard, analytics:viewAnalytics, expenses:viewExpenses, closing:viewClosing, admin:viewAdmin};
  const tabs = currentTabs();
  if(!tabs.includes(activeTab)){ activeTab = tabs[0]; render(); return; }
  document.querySelectorAll('.navbtn').forEach(b=>{ b.classList.toggle('active', b.dataset.tab===activeTab); });
  document.querySelector('.topbar h1').textContent = NAV_LABEL[activeTab] + (activeTab==='kitchen' && kitchenStation? ' · '+stationsMap()[kitchenStation]:'');
  const pill = document.getElementById('drawerPill');
  if(pill){ pill.className = `drawer-pill ${state.cashDrawer.isOpen?'open':''}`; pill.innerHTML = `<span class="dd"></span>ลิ้นชัก ฿${fmt(state.cashDrawer.float)}`; }
  v.innerHTML = map[activeTab]();
  bindViewEvents();
}

    <div class="field"><label>เหตุผลที่เปิดลิ้นชัก (เช่น ทอนเงิน, ตรวจนับ)</label><input id="drawerReason" placeholder="ระบุเหตุผล"></div>
    <div class="modal-actions">

    </div>
  </div>`;
  document.body.appendChild(overlay);
  if(canSetFloat){
    overlay.querySelector('#setFloatBtn').onclick = ()=>{
      const val = +overlay.querySelector('#setFloatVal').value;
      if(isNaN(val) || val<0){ toast('กรุณาใส่จำนวนเงินให้ถูกต้อง'); return; }
      const old = state.cashDrawer.float;
      state.cashDrawer.float = val;
      addAudit(`ปรับยอดเงินในลิ้นชักจาก ฿${fmt(old)} เป็น ฿${fmt(val)} โดย ${session.name}`);
      saveState(); toast('บันทึกยอดเงินในลิ้นชักแล้ว'); overlay.remove(); render();
    };
  }
  overlay.querySelector('#cancelDrawer').onclick = ()=>overlay.remove();
  overlay.querySelector('#confirmDrawer').onclick = ()=>{
    const reason = overlay.querySelector('#drawerReason').value.trim()||'ไม่ระบุเหตุผล';
    state.cashDrawer.isOpen = true;
    state.cashDrawer.log.unshift({time:new Date().toISOString(), by:session.name, reason});
    addAudit(`เปิดลิ้นชักเก็บเงิน (เหตุผล: ${reason})`);
    saveState(); overlay.remove(); render();
    setTimeout(()=>{ state.cashDrawer.isOpen=false; saveState(); const p=document.getElementById('drawerPill'); if(p) p.className='drawer-pill'; }, 3000);
  };
}

/* ============================= POS ============================= */
function cartLineTotal(line){
  const p = state.products.find(x=>x.id===line.pid); if(!p) return 0;
  let extra = 0;
  (line.opts||[]).forEach(o=>{ if(o.includes('+10')) extra+=10; if(o.includes('+15')) extra+=15; });
  return (p.price+extra)*line.qty;
}
function cartSubtotal(){ return cart.items.reduce((s,l)=>s+cartLineTotal(l),0); }
function cartDiscountAmt(){
  const sub = cartSubtotal();
  if(cart.discount.type==='percent') return Math.round(sub*cart.discount.value/100);
  if(cart.discount.type==='amount') return Math.min(cart.discount.value, sub);
  return 0;
}
function cartTotal(){ return Math.max(0, cartSubtotal()-cartDiscountAmt()); }

    const orderId = cart.orderId;
    const o = state.orders.find(x=>x.id===orderId);
    if(!o) return;

  const sendBtn = document.getElementById('sendKitchen'); if(sendBtn) sendBtn.onclick = sendToKitchen;

  const custGridSel = document.getElementById('menuGridCustomerSel'); if(custGridSel) custGridSel.onchange = ()=>{ state.menuGridColsCustomer = +custGridSel.value; saveState(); toast('บันทึกแล้ว — มีผลกับหน้าลูกค้าสแกน QR ครั้งถัดไป'); };

function getCategoryOptions(category){
  let co = state.categoryOptions.find(c=>c.category===category);
  if(!co){ co = {category, useNoodle:false, useStyle:false, extras:[]}; state.categoryOptions.push(co); }
  return co;
}
function openOptionsModal(pid){
  const p = state.products.find(x=>x.id===pid);
  const co = getCategoryOptions(p.category);
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>${p.name} <span class="mono" style="color:var(--broth); font-size:14px;">฿${fmt(p.price)}</span></h3>
    ${p.image? `<div class="thumb-preview" id="optImgPreview" style="width:100%; height:200px; cursor:zoom-in; background-image:url('${p.image.replace(/'/g,"%27")}')"></div>`:''}
    ${co.useNoodle?`<div class="opt-group"><div class="og-title">เลือกเส้น</div>${state.productOptions.noodle.map(n=>`<label class="opt-choice"><input type="radio" name="noodle" value="${n}">${n}</label>`).join('')}</div>`:''}
    ${co.useStyle?`<div class="opt-group"><div class="og-title">ระดับ</div>${state.productOptions.style.map(n=>`<label class="opt-choice"><input type="radio" name="style" value="${n}">${n}</label>`).join('')}</div>`:''}
    ${co.extras.length?`<div class="opt-group"><div class="og-title">เพิ่มเติม</div>${co.extras.map(n=>`<label class="opt-choice"><input type="checkbox" name="extra" value="${n}">${n}</label>`).join('')}</div>`:''}
    <div class="field"><label>หมายเหตุลูกค้า</label><input type="text" id="optNote" placeholder="เช่น ไม่เผ็ด"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cancelOpt">ยกเลิก</button><button class="btn btn-primary" id="confirmOpt">เพิ่มลงตะกร้า</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const optImg = overlay.querySelector('#optImgPreview'); if(optImg) optImg.onclick = ()=>openImageLightbox(p.image, p.name);
  overlay.querySelector('#cancelOpt').onclick = ()=>overlay.remove();
  overlay.querySelector('#confirmOpt').onclick = ()=>{
    const noodle = overlay.querySelector('input[name=noodle]:checked');
    const style = overlay.querySelector('input[name=style]:checked');
    const extras = [...overlay.querySelectorAll('input[name=extra]:checked')].map(x=>x.value);
    const note = overlay.querySelector('#optNote').value.trim();
    const opts = []; if(noodle) opts.push(noodle.value); if(style) opts.push(style.value); opts.push(...extras);
    const existing = cart.items.find(l=>l.pid===pid && JSON.stringify(l.opts)===JSON.stringify(opts) && l.note===note);
    if(existing) existing.qty += 1; else cart.items.push({pid, qty:1, opts, note});
    overlay.remove(); renderView();
  };
}

function deductStockForItems(items){
  items.forEach(line=>{
    const p = state.products.find(x=>x.id===line.pid); if(!p) return;
    (p.recipe||[]).forEach(r=>{ const s = state.stock.find(x=>x.id===r.stockId); if(s) s.qty = Math.max(0, s.qty - r.qty*line.qty); });
  });
}
function restoreStockForItems(items){
  items.forEach(line=>{
    const p = state.products.find(x=>x.id===line.pid); if(!p) return;
    (p.recipe||[]).forEach(r=>{ const s = state.stock.find(x=>x.id===r.stockId); if(s) s.qty += r.qty*line.qty; });
  });
}
function freeTableIfOrder(o){
  if(o.tableId){
    const t = state.tables.find(x=>x.id===o.tableId);
    if(t && t.orderId===o.id){ t.status='free'; t.orderId=null; }
  }
}
async function cancelOrder(orderId, reason){
  const o = state.orders.find(x=>x.id===orderId);
  if(!o || o.status==='paid') return;
  restoreStockForItems(o.items);
  o.status = 'cancelled'; o.cancelledAt = new Date().toISOString(); o.cancelReason = reason||'';
  freeTableIfOrder(o);
  if(cart.orderId===o.id){ cart = { tableId:null, orderId:null, channel:"หน้าร้าน", memberId:"", items:[], discount:{type:"none", value:0, code:null} }; }
  addAudit(`ยกเลิกออเดอร์ #${o.no}${reason?` (เหตุผล: ${reason})`:''}`);
  await saveState(); renderView();
}
async function cancelOrderLine(orderId, lineIdx, reason){
  const o = state.orders.find(x=>x.id===orderId);
  if(!o) return;
  const line = o.items[lineIdx]; if(!line) return;
  restoreStockForItems([line]);
  const removedName = state.products.find(p=>p.id===line.pid)?.name || 'รายการ';
  o.items.splice(lineIdx,1);
  addAudit(`ลบ "${removedName}" ออกจากออเดอร์ #${o.no}${reason?` (เหตุผล: ${reason})`:''}`);
  if(o.items.length===0){
    o.status='cancelled'; o.cancelledAt=new Date().toISOString(); o.cancelReason='ไม่มีรายการเหลือ';
    freeTableIfOrder(o);

function sendToKitchen(){
  if(cart.items.length===0){ toast("ยังไม่มีรายการอาหาร"); return; }
  let order = null;
  if(cart.orderId) order = state.orders.find(o=>o.id===cart.orderId && o.status!=='paid');
  else if(cart.tableId) order = state.orders.find(o=>o.tableId===cart.tableId && (o.status==='kitchen'||o.status==='pending-confirm'));
  const itemsWithStatus = cart.items.map(l=>({...l, kstatus:"กำลังทำ"}));
  if(order){
    order.items = itemsWithStatus; order.discount = {...cart.discount}; order.status='kitchen';
    order.channel = cart.channel; order.memberId = cart.memberId;
  } else {
    order = { id:"o"+state.nextOrderNo, no:state.nextOrderNo, tableId:cart.tableId, channel:cart.channel, memberId:cart.memberId,
      items:itemsWithStatus, discount:{...cart.discount}, status:"kitchen", source:'staff', createdAt:new Date().toISOString(), role:session.role };
    state.nextOrderNo++; state.orders.push(order);
  }
  deductStockForItems(cart.items);
  if(cart.tableId){ const t = state.tables.find(x=>x.id===cart.tableId); t.status="wait"; t.orderId=order.id; t.pendingSelfOrder=null; }
  addAudit(`ส่งออเดอร์ #${order.no} เข้าครัว (${order.items.length} รายการ)`);
  cart = { tableId:null, orderId:null, channel:"หน้าร้าน", memberId:"", items:[], discount:{type:"none", value:0, code:null} };
  saveState(); toast(`ส่งออเดอร์ #${order.no} เข้าครัวแล้ว`); renderView();
}

function openCheckoutModal(){

    <div class="modal-actions"><button class="btn btn-ghost" id="cancelPay">ยกเลิก</button><button class="btn btn-primary" id="confirmPay">ยืนยันรับเงิน</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const payMethod = overlay.querySelector('#payMethod'), cashRow=overlay.querySelector('#cashRow'), cashQuick=overlay.querySelector('#cashQuick');
  const cashGiven = overlay.querySelector('#cashGiven'), changeBox=overlay.querySelector('#changeBox'), qrPayBox=overlay.querySelector('#qrPayBox');
  const proofBox = overlay.querySelector('#proofBox'), confirmBtn = overlay.querySelector('#confirmPay');
  let paymentProofImage = '';
  function updateConfirmState(){
    const needsProof = payMethod.value==='QR';
    confirmBtn.disabled = needsProof && !paymentProofImage;
    confirmBtn.style.opacity = confirmBtn.disabled ? '0.5' : '1';
  }
  function updateProofBox(){
    if(payMethod.value!=='QR'){ proofBox.innerHTML=''; updateConfirmState(); return; }
    proofBox.innerHTML = `
      <div class="field"><label>แนบหลักฐานการชำระเงิน (ภาพสลิป) — จำเป็นสำหรับ QR Payment</label><input type="file" id="proofFile" accept="image/*"></div>
      <div id="proofPreview" class="thumb-preview" style="width:100px; height:100px;">${paymentProofImage? `<img src="${paymentProofImage}" style="width:100%;height:100%;object-fit:cover;border-radius:8px; cursor:pointer;" id="proofPreviewImg">` : '🧾'}</div>`;
    const fileInput = overlay.querySelector('#proofFile');
    fileInput.onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      if(file.size > 1200*1024){ toast('รูปใหญ่เกินไป กรุณาเลือกไฟล์ไม่เกิน ~1.2MB'); return; }
      paymentProofImage = await readFileAsDataURL(file);
      updateProofBox();
    };
    const previewImg = overlay.querySelector('#proofPreviewImg');
    if(previewImg) previewImg.onclick = ()=>openImageLightbox(paymentProofImage, 'หลักฐานการชำระเงิน');
    updateConfirmState();
  }
  function updateQrBox(){
    if(payMethod.value!=='QR'){ qrPayBox.innerHTML=''; return; }
    const qr = promptpayQrImg(total, 170);
    if(!qr){ qrPayBox.innerHTML = `<div class="notice">ยังไม่ได้ตั้งค่าหมายเลข PromptPay ของร้าน — ไปตั้งค่าได้ที่ ตั้งค่า → ตั้งค่าใบเสร็จ</div>`; return; }
    qrPayBox.innerHTML = `<div class="qr-box"><img src="${qr}" width="170" height="170" alt="PromptPay QR ฿${fmt(total)}"><p class="hint">ให้ลูกค้าสแกนจ่าย ฿${fmt(total)} พอดี</p></div>`;
  }
  function updateChange(){
    if(payMethod.value!=='เงินสด'){ cashRow.style.display='none'; cashQuick.style.display='none'; changeBox.innerHTML=''; changeBox.className='change-box'; return; }
    cashRow.style.display='flex'; cashQuick.style.display='flex';
    const given = +cashGiven.value||0;
    if(given<=0){ changeBox.innerHTML = ''; changeBox.className='change-box'; return; }
    const change = given - total;
    if(change < 0){
      changeBox.className = 'change-box change-short';
      changeBox.innerHTML = `<div class="change-label">รับเงินไม่พอ ขาดอีก</div><div class="change-amount mono">฿${fmt(Math.abs(change))}</div>`;
    } else {
      changeBox.className = 'change-box change-ok';
      changeBox.innerHTML = `<div class="change-label">เงินทอน</div><div class="change-amount mono">฿${fmt(change)}</div>`;
    }
  }
  payMethod.onchange = ()=>{ updateChange(); updateQrBox(); updateProofBox(); }; cashGiven.oninput = updateChange; updateChange(); updateQrBox(); updateProofBox();
  overlay.querySelectorAll('[data-cashadd]').forEach(b=>b.onclick=()=>{ cashGiven.value = (+cashGiven.value||0)+(+b.dataset.cashadd); updateChange(); });
  overlay.querySelector('#cashExact').onclick = ()=>{ cashGiven.value = total; updateChange(); };
  overlay.querySelector('#printBillBtn').onclick = ()=>printBill(cart.items, total, payMethod.value);
  overlay.querySelector('#cancelPay').onclick = ()=>overlay.remove();
  confirmBtn.onclick = ()=>{
    if(payMethod.value==='QR' && !paymentProofImage){ toast('กรุณาแนบหลักฐานการชำระเงินก่อนปิดยอด'); return; }
    finalizeSale(payMethod.value, total, paymentProofImage);
    overlay.remove();
  };
}

function finalizeSale(payMethod, total, paymentProofImage){
  let order = null;
  if(cart.orderId) order = state.orders.find(o=>o.id===cart.orderId && o.status!=='paid');
  else if(cart.tableId){ const t = state.tables.find(x=>x.id===cart.tableId); order = state.orders.find(o=>o.id===t.orderId && o.status!=='paid'); }
  const paidItems = cart.items.map(l=>({...l, kstatus:"เสิร์ฟแล้ว"}));
  if(order){
    order.status='paid'; order.payMethod=payMethod; order.paidAt=new Date().toISOString(); order.total=total; order.items = order.items.length? order.items.map(l=>({...l,kstatus:"เสิร์ฟแล้ว"})) : paidItems;
    order.paymentProofImage = paymentProofImage || '';
  } else {
    order = { id:"o"+state.nextOrderNo, no:state.nextOrderNo, tableId:cart.tableId, channel:cart.channel, memberId:cart.memberId,
      items:paidItems, discount:{...cart.discount}, status:'paid', source:'staff', payMethod, total, paymentProofImage: paymentProofImage||'', createdAt:new Date().toISOString(), paidAt:new Date().toISOString(), role:session.role };
    state.nextOrderNo++; state.orders.push(order); deductStockForItems(order.items);
  }
  if(cart.tableId){ const t = state.tables.find(x=>x.id===cart.tableId); t.status='free'; t.orderId=null; t.pendingSelfOrder=null; }
  if(cart.memberId){ const m = state.members.find(x=>x.id===cart.memberId); m.visits+=1; m.spend+=total; m.points+=Math.floor(total/500); }
  if(payMethod==='เงินสด') state.cashDrawer.float += total;
  addAudit(`รับชำระออเดอร์ #${order.no} ฿${fmt(total)} (${payMethod})`);
  cart = { tableId:null, orderId:null, channel:"หน้าร้าน", memberId:"", items:[], discount:{type:"none", value:0, code:null} };
  saveState(); announcePaymentReceived(total, payMethod); renderView();
}

function bindTablesEvents(){
  document.querySelectorAll('[data-opentable]').forEach(b=>b.onclick=()=>{
    const t = state.tables.find(x=>x.id===b.dataset.opentable);
    const order = state.orders.find(o=>o.id===t.orderId && o.status!=='paid');
    cart = { tableId:t.id, orderId: order? order.id : null, channel: order? order.channel:"หน้าร้าน", memberId: order? order.memberId:"", items: order? JSON.parse(JSON.stringify(order.items)) : [], discount: order? {...order.discount} : {type:'none',value:0,code:null} };
    activeTab='pos'; render(); startPolling();
  });
  document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>openTableQR(b.dataset.qr));
  document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openSelfOrderReview(b.dataset.review));
  const applyBtn = document.getElementById('applyTableCount');
  if(applyBtn) applyBtn.onclick = ()=>{
    const n = Math.max(1, Math.min(60, +document.getElementById('tableCount').value || state.tables.length));
    const cur = state.tables.length;
    if(n > cur){
      const nums = state.tables.map(t=>parseInt((t.name.match(/\d+/)||['0'])[0],10));
      let nextNum = Math.max(0,...nums) + 1;
      for(let i=0;i<n-cur;i++){
        state.tables.push({id:'t'+Date.now()+'-'+i, name:'โต๊ะ '+nextNum, status:'free', orderId:null, pendingSelfOrder:null});
        nextNum++;
      }
    } else if(n < cur){
      const removable = [];
      for(let i=state.tables.length-1;i>=0 && removable.length < (cur-n); i--){
        if(state.tables[i].status==='free' && !state.tables[i].pendingSelfOrder) removable.push(state.tables[i].id);
      }
      if(removable.length < (cur-n)) toast('บางโต๊ะกำลังใช้งานอยู่ ลบได้เฉพาะโต๊ะที่ว่าง');
      state.tables = state.tables.filter(t=>!removable.includes(t.id));
    }
    addAudit(`ปรับจำนวนโต๊ะเป็น ${state.tables.length} โต๊ะ`);
    saveState(); renderView();
  };
  const gridSel = document.getElementById('tableGridSel');
  if(gridSel) gridSel.onchange = ()=>{
    if(gridSel.value==='custom'){ state.tableGridCols = state.tableGridCols>0? state.tableGridCols : 8; }
    else { state.tableGridCols = +gridSel.value; }
    saveState(); renderView();
  };
  const gridCustom = document.getElementById('tableGridCustom');
  if(gridCustom) gridCustom.onchange = ()=>{
    const n = Math.max(1, Math.min(12, +gridCustom.value||1));
    state.tableGridCols = n;
    saveState(); renderView();
  };
}

function openTableQR(tableId){
  const t = state.tables.find(x=>x.id===tableId);
  const realUrl = window.location.origin + window.location.pathname + '?table=' + encodeURIComponent(t.id);
  const isHosted = window.location.protocol==='https:';
  const data = encodeURIComponent(realUrl);
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>QR สั่งอาหาร · ${t.name}</h3>
    <div class="qr-box"><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${data}" width="180" height="180" alt="QR ${t.name}"></div>
    ${isHosted? `
      <p class="hint" style="text-align:center; word-break:break-all;">${realUrl}</p>
      <div class="notice">QR นี้ใช้งานได้จริงแล้ว — ลิงก์ไปหน้านี้เองพร้อมระบุโต๊ะ ลูกค้าสแกนแล้วสั่งอาหารได้เลยโดยไม่ต้องล็อกอิน ตราบใดที่หน้านี้ยังคงถูกโฮสต์อยู่ที่ URL เดิม (ถ้าย้าย/เผยแพร่ใหม่เป็นลิงก์อื่น ต้องพิมพ์ QR ใหม่ทุกโต๊ะ)</div>`
    : `<div class="notice">ตอนนี้หน้านี้ยังไม่ได้ถูกเปิดผ่าน URL สาธารณะแบบ HTTPS (เช่น เปิดจากไฟล์ในเครื่อง) QR โค้ดจึงยังใช้งานจริงไม่ได้ — เมื่อเผยแพร่หน้านี้เป็นลิงก์จริงแล้ว (เช่นกด Publish ในแชท หรืออัปโหลดขึ้นเว็บโฮสติ้งของคุณ) กลับมาเปิดหน้านี้จาก URL นั้นอีกครั้ง แล้วพิมพ์ QR ใหม่ ลิงก์จะใช้งานได้จริงทันที</div>`}
    <button class="btn btn-primary" style="width:100%;" id="simulateScan">จำลอง: ลูกค้าสแกนแล้วสั่งอาหาร</button>
    <div class="modal-actions"><button class="btn btn-ghost" style="width:100%;" id="closeQR">ปิด</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeQR').onclick = ()=>overlay.remove();
  overlay.querySelector('#simulateScan').onclick = ()=>{ overlay.remove(); openCustomerSelfOrder(tableId); };
}

function viewKitchen(){
  const isKitchenRole = session.role==='kitchen';
  const stationChoices = Object.keys(stationsMap());
  if(isKitchenRole) kitchenStation = session.station;
  else if(!kitchenStation || !stationChoices.includes(kitchenStation)) kitchenStation = stationChoices[0];

  const activeOrders = state.orders.filter(o=>o.status==='kitchen').sort((a,b)=>a.no-b.no);
  const tickets = activeOrders.map(o=>{
    const lines = o.items.map((l,idx)=>({...l, idx})).filter(l=>{
      const p = state.products.find(x=>x.id===l.pid); return p && p.station===kitchenStation && l.kstatus!=='เสิร์ฟแล้ว';
    });
    return {order:o, lines};
  }).filter(t=>t.lines.length>0);

  tickets.forEach(t=>{ t.progress = Math.min(...t.lines.map(l=>KSTEPS.indexOf(l.kstatus))); });
  tickets.forEach(t=>{
    t.skipped = tickets.some(t2=> t2.order.id!==t.order.id && new Date(t2.order.createdAt) > new Date(t.order.createdAt) && t2.progress > t.progress);
    t.elapsedMin = Math.max(0, Math.floor((Date.now() - new Date(t.order.createdAt).getTime())/60000));
  });

  const newSkips = tickets.filter(t=>t.skipped && !alertedSkipIds.has(t.order.id));
  if(newSkips.length){
    newSkips.forEach(t=>alertedSkipIds.add(t.order.id));
    playAlertBeep();
    toast(`⚠️ ออเดอร์ #${newSkips[0].order.no} ถูกข้ามคิว!`);
  }
  const stillSkippedIds = new Set(tickets.filter(t=>t.skipped).map(t=>t.order.id));
  [...alertedSkipIds].forEach(id=>{ if(!tickets.find(t=>t.order.id===id)) alertedSkipIds.delete(id); });

  return `
  ${!isKitchenRole? `<div class="station-tabs">${stationChoices.map(s=>`<button class="station-tab ${s===kitchenStation?'active':''}" data-station="${s}">${stationsMap()[s]}</button>`).join('')}</div>`:''}
  ${tickets.length===0? `<div class="empty">ไม่มีออเดอร์ค้างในสถานี ${stationsMap()[kitchenStation]}</div>` : `
  <div class="kds-rail">
    ${tickets.map(({order,lines,skipped,elapsedMin})=>{
      const table = order.tableId? state.tables.find(x=>x.id===order.tableId).name : (order.channel||'ซื้อกลับ');
      const elCls = elapsedMin>=15? 'el-late' : elapsedMin>=8? 'el-warn' : 'el-ok';
      return `<div class="ticket ${skipped?'ticket-skipped':''}">
        ${skipped? `<div class="skip-banner">⚠️ ถูกข้ามคิว — มีออเดอร์ใหม่กว่าเริ่มทำไปก่อนแล้ว</div>`:''}
        <div class="ticket-head"><span>${table} · #${order.no}${order.source==='customer-self'?' · QR':''}</span>
          <span class="time">${new Date(order.createdAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}<span class="elapsed-badge ${elCls}">รอ ${elapsedMin} นาที</span></span>
        </div>
        ${lines.map(l=>{
          const p=state.products.find(x=>x.id===l.pid); const stepIdx = KSTEPS.indexOf(l.kstatus);
          return `<div class="ticket-line">
            <div class="tl-name">${p.name} × ${l.qty}</div>
            ${(l.opts&&l.opts.length)? `<span class="tl-opt">${l.opts.join(' · ')}</span>`:''}
            ${l.note? `<span class="tl-opt">หมายเหตุ: ${l.note}</span>`:''}
            <div class="tl-status">${l.kstatus}</div>
            <div style="display:flex; gap:4px; margin-top:5px;">
              ${stepIdx<KSTEPS.length-1? `<button class="btn btn-secondary tl-btn" style="margin-top:0; width:auto; flex:1;" data-advance="${order.id}" data-line="${l.idx}">✓ ทำเสร็จแล้ว</button>`:''}
              <button class="btn btn-ghost tl-btn" style="margin-top:0; width:auto; flex:0 0 44px; padding:6px 4px; color:var(--chili); border-color:var(--chili);" data-cancelline="${order.id}" data-line="${l.idx}">ลบ</button>
            </div>
          </div>`;
        }).join('')}
        <button class="btn btn-ghost btn-small" style="width:100%; margin-top:8px; color:var(--chili); border-color:var(--chili);" data-cancelorder="${order.id}">✕ ยกเลิกทั้งออเดอร์</button>
      </div>`;
    }).join('')}
  </div>`}`;
}
function playAlertBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    o.start(); o.stop(ctx.currentTime+0.36);
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 500);
  }catch(e){}
}
function playPaymentChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const now = ctx.currentTime;
    [660, 990].forEach((freq,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
      const start = now + i*0.13;
      g.gain.setValueAtTime(0.001, start);
      g.gain.exponentialRampToValueAtTime(0.22, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, start+0.28);
      o.start(start); o.stop(start+0.3);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 700);
  }catch(e){}
}
function announcePaymentReceived(amount, payMethod){
  playPaymentChime();
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(`รับชำระเงินแล้ว ${fmt(amount)} บาท`);
      msg.lang = 'th-TH'; msg.rate = 0.95;
      window.speechSynthesis.speak(msg);
    }
  }catch(e){}
  showPaymentBanner(amount, payMethod);
}
function showPaymentBanner(amount, payMethod){
  const el = document.createElement('div');
  el.className = 'payment-banner';
  el.innerHTML = `<div class="pb-icon">✓</div><div><div class="pb-label">รับชำระเงินแล้ว · ${payMethod}</div><div class="pb-amount mono">฿${fmt(amount)}</div></div>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add('pb-out'); setTimeout(()=>el.remove(), 400); }, 3200);
}

/* ============================= DASHBOARD (today) ============================= */
function computePeriodStats(fromDate, toDate){
  const paid = state.orders.filter(o=>o.status==='paid' && o.paidAt && o.paidAt.slice(0,10)>=fromDate && o.paidAt.slice(0,10)<=toDate);
  const sales = paid.reduce((s,o)=>s+(o.total||0),0);
  const cogs = paid.reduce((s,o)=>s+o.items.reduce((s2,l)=>{ const p=state.products.find(x=>x.id===l.pid); return s2+(p?p.cost*l.qty:0); },0),0);
  const exp = state.expenses.filter(e=>e.date>=fromDate && e.date<=toDate).reduce((s,e)=>s+e.total,0);
  return { paid, sales, cogs, grossProfit:sales-cogs, expenses:exp, netProfit:sales-cogs-exp };
}
function lastDayOfMonth(monthStr){
  const y = +monthStr.slice(0,4), m = +monthStr.slice(5,7);
  const last = new Date(y, m, 0).getDate();
  return monthStr+'-'+String(last).padStart(2,'0');
}
function renderVBars(items, opts){
  opts = opts || {};
  const max = Math.max(1, ...items.map(i=>i.value));
  if(items.length===0) return `<div class="empty">ยังไม่มีข้อมูล</div>`;
  return `<div class="vbar-chart">
    ${items.map(it=>{
      const h = Math.max(3, Math.round(it.value/max*100));
      const attr = opts.attrName ? `${opts.attrName}="${it.key}"` : '';
      return `<div class="vbar-col" ${attr}>
        <div class="vbar-val mono">${opts.valueFmt? opts.valueFmt(it.value) : '฿'+fmt(it.value)}</div>
        <div class="vbar-fill" style="height:${h}%; background:${it.color||'var(--gold)'};"></div>
        <div class="vbar-label">${it.label}</div>
        ${it.sub? `<div class="vbar-sub">${it.sub}</div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

    <div class="modal-actions"><button class="btn btn-primary" style="width:100%;" id="closeMonthDetail">ปิด</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeMonthDetail').onclick = ()=>overlay.remove();

function viewDashboard(){
  const today = todayStr();
  const st = computePeriodStats(today, today);
  const bills = st.paid.length; const avg = bills? Math.round(st.sales/bills):0;
  const itemCount = {}; st.paid.forEach(o=>o.items.forEach(l=>{ itemCount[l.pid]=(itemCount[l.pid]||0)+l.qty; }));
  const topItems = Object.entries(itemCount).sort((a,b)=>b[1]-a[1]).slice(0,5); const maxQty = topItems.length?topItems[0][1]:1;
  const byChannel = {}; st.paid.forEach(o=>{ byChannel[o.channel||'หน้าร้าน']=(byChannel[o.channel||'หน้าร้าน']||0)+(o.total||0); });
  const maxChan = Math.max(1,...Object.values(byChannel));
  const byRole = {}; st.paid.forEach(o=>{ const r=ROLES[o.role]?.label||o.role||'ไม่ระบุ'; byRole[r]=(byRole[r]||0)+(o.total||0); });
  const maxRole = Math.max(1,...Object.values(byRole));

  return `
  <div class="kpi-row">
    <div class="kpi"><div class="klabel">💰 ยอดขายวันนี้</div><div class="kval mono">฿${fmt(st.sales)}</div></div>

    </div>
    <div class="panel"><div class="section-title">ยอดขายตามช่องทาง</div>
      ${Object.keys(byChannel).length? Object.entries(byChannel).map(([ch,amt])=>`<div class="bar-row"><div class="bar-label">${ch}</div><div class="bar-track"><div class="bar-fill" style="background:var(--blue); width:${amt/maxChan*100}%"></div></div><div class="bar-val mono">฿${fmt(amt)}</div></div>`).join(''):`<div class="empty">ยังไม่มีข้อมูลวันนี้</div>`}
    </div>
  </div>
  <div class="panel" style="margin-top:16px;"><div class="section-title">ยอดขายตามพนักงาน (บทบาทที่ขาย)</div>
    ${Object.keys(byRole).length? Object.entries(byRole).map(([r,amt])=>`<div class="bar-row"><div class="bar-label">${r}</div><div class="bar-track"><div class="bar-fill" style="background:var(--herb); width:${amt/maxRole*100}%"></div></div><div class="bar-val mono">฿${fmt(amt)}</div></div>`).join(''):`<div class="empty">ยังไม่มีข้อมูลวันนี้</div>`}
  </div>
  ${dashboardTrendPanels(today)}`;
}
function dashboardTrendPanels(today){
  const byMonthAll = {};
  state.orders.filter(o=>o.status==='paid').forEach(o=>{ const m=o.paidAt.slice(0,7); byMonthAll[m]=(byMonthAll[m]||0)+(o.total||0); });
  const months = Object.keys(byMonthAll).sort();

  const monthPrefix = today.slice(0,7);
  const dayStats = {};
  state.orders.filter(o=>o.status==='paid' && o.paidAt && o.paidAt.slice(0,7)===monthPrefix).forEach(o=>{
    const d = o.paidAt.slice(0,10);
    if(!dayStats[d]) dayStats[d] = {total:0, items:{}};
    dayStats[d].total += (o.total||0);
    o.items.forEach(l=>{ dayStats[d].items[l.pid] = (dayStats[d].items[l.pid]||0)+l.qty; });
  });
  const dayKeys = Object.keys(dayStats).sort();
  const weekday = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  const monthItems = months.map(m=>({ key:m, value:byMonthAll[m], label:m.slice(5)+'/'+m.slice(2,4), color:'var(--blue)' }));
  const dayItems = dayKeys.map(d=>{
    const ds = dayStats[d];
    const topEntry = Object.entries(ds.items).sort((a,b)=>b[1]-a[1])[0];
    const topProd = topEntry? state.products.find(x=>x.id===topEntry[0]) : null;
    return { key:d, value:ds.total, label:d.slice(8)+' '+weekday[new Date(d).getDay()], sub: topProd? topProd.name : '' };
  });

  return `
  <div class="panel" style="margin-top:16px;"><div class="section-title">ยอดขายรายเดือน (แตะแท่งเพื่อดูรายละเอียด)</div>
    ${renderVBars(monthItems, {attrName:'data-monthdetail'})}
  </div>
  <div class="panel" style="margin-top:16px;"><div class="section-title">ยอดขายรายวัน (เดือนนี้) — แตะแท่งเพื่อดูเมนูขายดีของวันนั้น</div>
    ${renderVBars(dayItems, {attrName:'data-daydetail'})}
  </div>`;
}
function bindDashboardEvents(){
  document.querySelectorAll('[data-daydetail]').forEach(el=>el.onclick=()=>openDayDetailModal(el.dataset.daydetail));
  document.querySelectorAll('[data-monthdetail]').forEach(el=>el.onclick=()=>openMonthDetailModal(el.dataset.monthdetail));
}

function dateAddDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function viewAnalytics(){
  const today = todayStr();
  let from;
  if(analyticsRange==='7d') from = dateAddDays(today,-6);
  else if(analyticsRange==='30d') from = dateAddDays(today,-29);
  else if(analyticsRange==='month') from = today.slice(0,7)+'-01';
  else from = '2000-01-01';
  const st = computePeriodStats(from, today);

  const byDay = {};
  st.paid.forEach(o=>{ const d=o.paidAt.slice(0,10); byDay[d]=(byDay[d]||0)+(o.total||0); });
  const days = []; let cursor = from;
  while(cursor<=today && days.length<62){ days.push(cursor); cursor = dateAddDays(cursor,1); }
  const dayItems = days.map(d=>({ key:d, value:byDay[d]||0, label:d.slice(5) }));

  const byMonth = {};
  state.orders.filter(o=>o.status==='paid').forEach(o=>{ const m=o.paidAt.slice(0,7); byMonth[m]=(byMonth[m]||0)+(o.total||0); });
  const months = Object.keys(byMonth).sort();
  const monthItems = months.map(m=>({ key:m, value:byMonth[m], label:m.slice(5)+'/'+m.slice(2,4), color:'var(--blue)' }));

  return `
  <div class="range-row">
    <button class="range-btn ${analyticsRange==='7d'?'active':''}" data-range="7d">7 วันล่าสุด</button>
    <button class="range-btn ${analyticsRange==='30d'?'active':''}" data-range="30d">30 วันล่าสุด</button>
    <button class="range-btn ${analyticsRange==='month'?'active':''}" data-range="month">เดือนนี้</button>
    <button class="range-btn ${analyticsRange==='all'?'active':''}" data-range="all">ทั้งหมด</button>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div class="klabel">ยอดขายรวม</div><div class="kval mono">฿${fmt(st.sales)}</div></div>
    <div class="kpi"><div class="klabel">ต้นทุนขาย (COGS)</div><div class="kval mono">฿${fmt(st.cogs)}</div></div>
    <div class="kpi"><div class="klabel">รายจ่ายอื่นๆ</div><div class="kval mono">฿${fmt(st.expenses)}</div></div>
    <div class="kpi"><div class="klabel">กำไรสุทธิ</div><div class="kval mono">฿${fmt(st.netProfit)}</div></div>
  </div>
  <div class="panel" style="margin-bottom:16px;"><div class="section-title">ยอดขายรายวัน (แตะแท่งเพื่อดูรายละเอียด)</div>
    ${renderVBars(dayItems, {attrName:'data-daydetail'})}
  </div>
  <div class="panel"><div class="section-title">ยอดขายรายเดือน (แตะแท่งเพื่อดูรายละเอียด)</div>
    ${renderVBars(monthItems, {attrName:'data-monthdetail'})}
  </div>
  <div class="panel" style="margin-top:16px;">
    <div class="section-title">ประวัติการขาย (รายบิล)</div>
    <div style="max-height:400px; overflow-y:auto;">
    <table class="dt">
      <thead><tr><th>เวลา</th><th>บิล</th><th>โต๊ะ/ช่องทาง</th><th>ชำระโดย</th><th>ยอด</th></tr></thead>
      <tbody>${[...st.paid].sort((a,b)=> new Date(b.paidAt)-new Date(a.paidAt)).slice(0,150).map(o=>{
        const tableLabel = o.tableId? (state.tables.find(t=>t.id===o.tableId)?.name || '-') : (o.channel||'ซื้อกลับ');
        return `<tr data-billdetail="${o.id}" style="cursor:pointer;">
          <td class="mono">${new Date(o.paidAt).toLocaleString('th-TH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
          <td class="mono">#${o.no}</td><td>${tableLabel}</td><td>${o.payMethod||'-'}</td>
          <td class="mono">฿${fmt(o.total||0)}</td></tr>`;
      }).join('') || `<tr><td colspan="5"><div class="empty">ยังไม่มีบิลในช่วงนี้</div></td></tr>`}</tbody>
    </table>
    </div>
    <p class="hint">คลิกแถวเพื่อดูรายละเอียดสินค้าที่ขายในบิลนั้น</p>

function openBillLineDetail(cat, itemName){
  const matchedStock = state.stock.find(x=>x.name===itemName);
  const overlay = document.createElement('div'); overlay.className='overlay'; overlay.id='lineDetailOverlay';
  overlay.innerHTML = `<div class="modal">
    <h3>${itemName}</h3>
    <div class="form-grid">
      <div class="field"><label>จำนวน</label><input type="number" id="lnQty" value="1"></div>
      <div class="field"><label>หน่วย</label><input id="lnUnit" value="${matchedStock? matchedStock.unit : cat.unit}"></div>
    </div>
    <div class="field"><label>ราคาต่อหน่วย (บาท)</label><input type="number" step="0.01" id="lnPrice" value="${matchedStock && matchedStock.standardPrice? matchedStock.standardPrice : 0}"></div>
    ${matchedStock && matchedStock.standardPrice? `<p class="hint" id="lnPriceCompare">ราคาตั้งต้นที่เคยตั้งไว้: ฿${fmt(matchedStock.standardPrice)}/${matchedStock.unit}</p>` : (matchedStock? `<p class="hint">วัตถุดิบนี้ยังไม่เคยตั้งราคาตั้งต้นไว้ — ราคาที่กรอกครั้งนี้จะถูกบันทึกเป็นราคาตั้งต้นให้อัตโนมัติ</p>` : '')}
    <div class="hint" id="lnTotalPreview">รวม ฿0</div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cancelLineDetail">ยกเลิก</button><button class="btn btn-primary" id="addLineDetail">เพิ่มรายการ</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const qtyEl=overlay.querySelector('#lnQty'), priceEl=overlay.querySelector('#lnPrice'), prevEl=overlay.querySelector('#lnTotalPreview');
  const compareEl = overlay.querySelector('#lnPriceCompare');
  function upd(){
    prevEl.textContent = `รวม ฿${fmt((+qtyEl.value||0)*(+priceEl.value||0))}`;
    if(compareEl && matchedStock && matchedStock.standardPrice){
      const diff = (+priceEl.value||0) - matchedStock.standardPrice;
      if(Math.abs(diff) < 0.005){ compareEl.textContent = `ราคาตรงกับราคาตั้งต้นที่เคยตั้งไว้ (฿${fmt(matchedStock.standardPrice)}/${matchedStock.unit})`; compareEl.style.color = 'var(--herb)'; }
      else { compareEl.textContent = `⚠️ ราคานี้${diff>0?'สูงกว่า':'ต่ำกว่า'}ราคาตั้งต้นเดิม (฿${fmt(matchedStock.standardPrice)}/${matchedStock.unit}) อยู่ ฿${fmt(Math.abs(diff))}`; compareEl.style.color = 'var(--chili-deep)'; }
    }
  }
  qtyEl.oninput=upd; priceEl.oninput=upd; upd();
  overlay.querySelector('#cancelLineDetail').onclick = ()=>overlay.remove();
  overlay.querySelector('#addLineDetail').onclick = ()=>{
    const qty = +qtyEl.value||0; const price = +priceEl.value||0; const unit = overlay.querySelector('#lnUnit').value.trim()||cat.unit;
    if(qty<=0){ toast('กรุณาใส่จำนวน'); return; }
    billDraft.lines.push({ id:'ln'+Date.now(), category:cat.name, item:itemName, qty, unit, unitPrice:price, total:Math.round(qty*price*100)/100 });
    overlay.remove();
    if(matchedStock && matchedStock.standardPrice && Math.abs(price-matchedStock.standardPrice) >= 0.005){
      confirmPriceUpdate(matchedStock, price);
    } else if(matchedStock && !matchedStock.standardPrice && price>0){
      matchedStock.standardPrice = price;
    }
    renderBillModal();
  };
}
function confirmPriceUpdate(stockItem, newPrice){
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>ราคาเปลี่ยนไปจากเดิม</h3>
    <p class="hint">ราคาตั้งต้นเดิมของ "${stockItem.name}" คือ ฿${fmt(stockItem.standardPrice)}/${stockItem.unit} แต่ครั้งนี้ซื้อที่ ฿${fmt(newPrice)}/${stockItem.unit}</p>
    <p class="hint">ต้องการอัปเดตราคาตั้งต้นเป็นราคาใหม่นี้ไหม? (ไม่กระทบบิลที่เพิ่งบันทึก แค่เปลี่ยนราคาที่จะกรอกให้อัตโนมัติครั้งต่อไป)</p>
    <div class="modal-actions"><button class="btn btn-ghost" id="keepOldPrice">คงราคาเดิมไว้</button><button class="btn btn-primary" id="updateNewPrice">อัปเดตเป็นราคาใหม่</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#keepOldPrice').onclick = ()=>overlay.remove();
  overlay.querySelector('#updateNewPrice').onclick = ()=>{
    const old = stockItem.standardPrice;
    stockItem.standardPrice = newPrice;
    addAudit(`อัปเดตราคาตั้งต้นของ ${stockItem.name} จาก ฿${fmt(old)} เป็น ฿${fmt(newPrice)}`);
    saveState(); overlay.remove(); toast('อัปเดตราคาตั้งต้นแล้ว');
  };
}
async function saveBill(){
  if(billDraft.lines.length===0){ toast('กรุณาเพิ่มอย่างน้อย 1 รายการ'); return; }
  const total = billDraft.lines.reduce((s,l)=>s+l.total,0);
  const supplier = billDraft.supplierId? state.suppliers.find(s=>s.id===billDraft.supplierId) : null;
  const bill = { id:'bill'+Date.now(), date:billDraft.date, time:billDraft.time||'', supplierId:billDraft.supplierId||null, vendorNote:billDraft.vendorNote || (supplier?supplier.name:''), receiptImage:billDraft.receiptImage, lines:billDraft.lines, total };
  state.expenses.push(bill);
  const newMenuItems = [];
  bill.lines.forEach(l=>{
    let s = state.stock.find(x=>x.name===l.item);
    if(s){ s.qty += l.qty; }
    else { s = { id:'s'+Date.now()+Math.random().toString(36).slice(2,6), name:l.item, qty:l.qty, unit:l.unit, threshold: Math.max(1,Math.ceil(l.qty*0.3)), image:'', standardPrice:l.unitPrice||0 }; state.stock.push(s); }
    const cat = state.expenseCategories.find(c=>c.name===l.category);
    if(cat && cat.sellableDirectly && !state.products.find(p=>p.name===l.item)){
      const stationKey = Object.keys(stationsMap())[0] || null;
      const suggestedPrice = Math.ceil(((l.unitPrice||0) * 1.5) / 5) * 5;
      state.products.push({
        id:'p'+Date.now()+Math.random().toString(36).slice(2,5),
        name:l.item, category:l.category, station:stationKey, price:suggestedPrice, cost:l.unitPrice||0,
        image:'', status:'ขาย', recipe:[{stockId:s.id, qty:1}]
      });
      newMenuItems.push(l.item);
    }
  });
  addAudit(`บันทึกบิลรายจ่าย ${bill.vendorNote||''} ฿${fmt(total)} (${bill.lines.length} รายการ) และเพิ่มเข้าสต๊อกแล้ว`);
  if(newMenuItems.length){ addAudit(`เพิ่มเมนูขายใหม่อัตโนมัติจากรายจ่าย: ${newMenuItems.join(', ')} (ตั้งราคาเบื้องต้นให้แล้ว โปรดตรวจสอบ)`); }
  await saveState();
  const overlay = document.getElementById('billOverlay'); if(overlay) overlay.remove();
  billDraft = null;
  toast(newMenuItems.length? `บันทึกบิลแล้ว และเพิ่มเมนูขายใหม่: ${newMenuItems.join(', ')} (ไปตรวจสอบราคาที่หน้าเมนู)` : 'บันทึกบิลและเพิ่มสต๊อกแล้ว');
  renderView();
}

function viewClosing(){
  const today = todayStr();
  const st = computePeriodStats(today, today);
  const byMethod = {'เงินสด':0,'QR':0,'บัตร':0};
  st.paid.forEach(o=>{ byMethod[o.payMethod] = (byMethod[o.payMethod]||0)+(o.total||0); });
  const discount = st.paid.reduce((s,o)=>{ const sub=o.items.reduce((s2,l)=>s2+cartLineTotal(l),0); return s+Math.max(0, sub-(o.total||0)); },0);
  const alreadyClosed = state.dailyClosings.find(c=>c.date===today);
  return `<div class="panel" style="max-width:460px;">
    <div class="section-title">สรุปยอดวันนี้ (${today})</div>
    <div class="cf-row"><span>ยอดขายทั้งหมด</span><span class="mono">฿${fmt(st.sales)}</span></div>
    <div class="cf-row"><span>เงินสด</span><span class="mono">฿${fmt(byMethod['เงินสด'])}</span></div>
    <div class="cf-row"><span>QR</span><span class="mono">฿${fmt(byMethod['QR'])}</span></div>
    <div class="cf-row"><span>บัตร</span><span class="mono">฿${fmt(byMethod['บัตร'])}</span></div>
    <div class="cf-row"><span>ส่วนลดรวม</span><span class="mono">฿${fmt(discount)}</span></div>
    <div class="cf-row"><span>รายจ่ายวันนี้</span><span class="mono">฿${fmt(st.expenses)}</span></div>
    <div class="cf-total"><span>กำไรสุทธิวันนี้</span><span class="mono">฿${fmt(st.netProfit)}</span></div>
    ${alreadyClosed? `<div class="section-title">ปิดยอดแล้ว</div>
      <div class="cf-row"><span>เงินที่นับจริง</span><span class="mono">฿${fmt(alreadyClosed.counted)}</span></div>
      <div class="cf-total"><span>ส่วนต่าง</span><span class="mono" style="color:${alreadyClosed.diff===0?'var(--herb)':'var(--chili)'}">${alreadyClosed.diff===0?'ตรงกัน ✓':(alreadyClosed.diff>0?'เงินเกิน':'เงินขาด')+' ฿'+fmt(Math.abs(alreadyClosed.diff))}</span></div>`
    : `<div class="field" style="margin-top:12px;"><label>เงินสดที่นับได้จริง</label><input id="countedCash" type="number" placeholder="0"></div>
       <button class="btn btn-primary" id="doClose" style="width:100%;">ปิดยอดวันนี้</button>`}
  </div>`;
}
function bindClosingEvents(){
  const btn = document.getElementById('doClose'); if(!btn) return;
  btn.onclick = ()=>{
    const today = todayStr();
    const st = computePeriodStats(today, today);
    const cashExpected = st.paid.filter(o=>o.payMethod==='เงินสด').reduce((s,o)=>s+(o.total||0),0);
    const counted = +document.getElementById('countedCash').value||0;
    const diff = counted-cashExpected;
    state.dailyClosings.push({date:today, expected:cashExpected, counted, diff, closedBy:session.name, at:new Date().toISOString()});
    addAudit(`ปิดยอดประจำวัน ${today} ${diff===0?'(ตรงกัน)':diff>0?`(เงินเกิน ฿${fmt(diff)})`:`(เงินขาด ฿${fmt(Math.abs(diff))})`}`);
    saveState(); renderView(); toast(diff===0?'ปิดยอดสำเร็จ ยอดตรงกัน':'ปิดยอดสำเร็จ พบส่วนต่าง');
  };
}

const APPS_SCRIPT_CODE = `function doPost(e) {
  var data = JSON.parse(e.postData.contents);

  if (data.action === "saveAppState") {

      as.appendRow([i, json.substr(i * chunkSize, chunkSize), new Date().toISOString()]);
    }
    return ContentService.createTextOutput(JSON.stringify({status:"ok", chunks:chunkCount})).setMimeType(ContentService.MimeType.JSON);
  }

  var os = ss.getSheetByName("Orders") || ss.insertSheet("Orders");
  if (os.getLastRow() === 0) os.appendRow(["OrderID","Date","PaidAt","OrderNo","Table","Channel","PayMethod","Total","Items"]);
  var existingOrderIds = existingIds_(os, 1);
  var ordersAdded = 0;
  data.orders.forEach(function(o){
    if (existingOrderIds[o.id]) return;
    os.appendRow([o.id, data.date, o.paidAt||"", o.no, o.tableId||"", o.channel||"", o.payMethod||"", o.total||0, JSON.stringify(o.items)]);
    ordersAdded++;
  });

  var es = ss.getSheetByName("Expenses") || ss.insertSheet("Expenses");

  var existingBillIds = existingIds_(es, 1);
  var billsAdded = 0;

  data.expenses.forEach(function(bill){
    if (existingBillIds[bill.id]) return;
    var receiptUrl = "";
    if (bill.receiptImage && data.driveFolderId) {
      try {
        var match = bill.receiptImage.match(/^data:(image\\/[a-zA-Z]+);base64,(.+)$/);
        if (match) {
          var mimeType = match[1];
          var base64 = match[2];
          var bytes = Utilities.base64Decode(base64);
          var ext = mimeType.split("/")[1];
          var blob = Utilities.newBlob(bytes, mimeType, "receipt-" + bill.date + "-" + bill.id + "." + ext);
          var folder = DriveApp.getFolderById(data.driveFolderId);
          var file = folder.createFile(blob);
          file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
          receiptUrl = file.getUrl();
        }
      } catch (err) {
        receiptUrl = "ERROR: " + err;
      }
    }
    bill.lines.forEach(function(l){
      es.appendRow([bill.id, bill.date, bill.time||"", bill.vendorNote||"", l.category, l.item, l.qty, l.unit, l.unitPrice, l.total, bill.total, receiptUrl]);
    });
    billsAdded++;
  });

  if (data.rolePermissions) {
    var ps = ss.getSheetByName("Permissions") || ss.insertSheet("Permissions");
    ps.clearContents();
    ps.appendRow(["Role","AllowedTabs"]);
    Object.keys(data.rolePermissions).forEach(function(role){
      ps.appendRow([role, data.rolePermissions[role].join(", ")]);

  if (data.staffAccounts) {
    var us = ss.getSheetByName("StaffAccounts") || ss.insertSheet("StaffAccounts");
    us.clearContents();
    us.appendRow(["Username","Name","Role","Station"]);
    data.staffAccounts.forEach(function(a){
      us.appendRow([a.username, a.name, a.role, a.station||""]);
    });
  }

  if (data.expenseCategories) {
    var ecs = ss.getSheetByName("ExpenseCategories") || ss.insertSheet("ExpenseCategories");
    ecs.clearContents();
    ecs.appendRow(["Category","DefaultUnit","Items"]);
    data.expenseCategories.forEach(function(c){
      ecs.appendRow([c.name, c.unit, c.items.join(", ")]);
    });
  }

  return ContentService.createTextOutput(JSON.stringify({status:"ok", ordersAdded:ordersAdded, billsAdded:billsAdded})).setMimeType(ContentService.MimeType.JSON);
}

function existingIds_(sheet, col) {
  var lastRow = sheet.getLastRow();
  if (lastRow < 2) return {};
  var vals = sheet.getRange(2, col, lastRow - 1, 1).getValues();
  var set = {};
  vals.forEach(function(r){ if (r[0]) set[String(r[0])] = true; });
  return set;
}

function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var type = (e && e.parameter && e.parameter.type) || "restore";

  if (type === "state") {
    var as = ss.getSheetByName("AppState");
    if (!as || as.getLastRow() < 2) {
      return ContentService.createTextOutput(JSON.stringify({state: null})).setMimeType(ContentService.MimeType.JSON);
    }
    var rows = as.getRange(2, 1, as.getLastRow() - 1, 2).getValues();
    rows.sort(function(a, b){ return a[0] - b[0]; });
    var json = rows.map(function(r){ return r[1]; }).join("");
    return ContentService.createTextOutput(JSON.stringify({state: json})).setMimeType(ContentService.MimeType.JSON);
  }

  var result = { orders: [], expenses: [] };

  var os = ss.getSheetByName("Orders");
  if (os && os.getLastRow() > 1) {
    var orows = os.getRange(2, 1, os.getLastRow() - 1, 9).getValues();
    orows.forEach(function(r){
      var items = [];
      try { items = JSON.parse(r[8]); } catch (err) {}
      result.orders.push({ id:String(r[0]), date:r[1], paidAt:r[2], no:r[3], tableId:r[4], channel:r[5], payMethod:r[6], total:r[7], items:items });
    });
  }

  var es = ss.getSheetByName("Expenses");
  if (es && es.getLastRow() > 1) {
    var erows = es.getRange(2, 1, es.getLastRow() - 1, 12).getValues();
    var billMap = {};
    erows.forEach(function(r){
      var billId = String(r[0]);
      if (!billMap[billId]) {
        billMap[billId] = { id:billId, date:r[1], time:r[2], vendorNote:r[3], total:r[10], lines:[] };
      }
      billMap[billId].lines.push({ category:r[4], item:r[5], qty:r[6], unit:r[7], unitPrice:r[8], total:r[9] });
    });
    result.expenses = Object.keys(billMap).map(function(k){ return billMap[k]; });
  }

  return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
}`;

        ${tabKeys.map(tk=>`<tr><td>${NAV_ICON[tk]} ${NAV_LABEL[tk]}</td>${roles.map(r=>`<td style="text-align:center;"><input type="checkbox" data-permrole="${r}" data-permtab="${tk}" ${state.rolePermissions[r].includes(tk)?'checked':''}></td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
    </div>
    <p class="hint" style="margin-top:10px;">การเปลี่ยนแปลงมีผลกับจอที่ล็อกอินอยู่แล้วภายในไม่กี่วินาที (รอบ sync อัตโนมัติ) หรือทันทีเมื่อผู้ใช้สลับแท็บ/ล็อกอินใหม่</p>
  </div>`;
}
function bindAdminPermsEvents(){
  document.querySelectorAll('[data-permrole]').forEach(cb=>cb.onchange=(e)=>{
    const role = cb.dataset.permrole, tab = cb.dataset.permtab;
    const list = state.rolePermissions[role];
    if(!e.target.checked && list.length<=1 && list.includes(tab)){
      e.target.checked = true; toast('ต้องเปิดใช้งานอย่างน้อย 1 แถบเมนูต่อบทบาท'); return;
    }
    if(e.target.checked){ if(!list.includes(tab)) list.push(tab); }
    else { state.rolePermissions[role] = list.filter(t=>t!==tab); }
    addAudit(`ปรับสิทธิ์การเข้าถึง: ${ROLES[role].label} → ${NAV_LABEL[tab]} = ${e.target.checked?'เปิด':'ปิด'}`);
    saveState();
  });
}

function bindAdminStaffEvents(){
  const saveGcBtn = document.getElementById('saveGoogleClientId');
  if(saveGcBtn) saveGcBtn.onclick = ()=>{
    state.meta.googleClientId = document.getElementById('googleClientId').value.trim();
    addAudit('อัปเดต Google OAuth Client ID');
    saveState(); toast('บันทึกแล้ว');
  };
  document.querySelectorAll('[data-delacc]').forEach(b=>b.onclick=()=>{
    state.staffAccounts = state.staffAccounts.filter(a=>a.id!==b.dataset.delacc); addAudit('ลบบัญชีพนักงาน'); saveState(); renderView();
  });
  const addAcc = document.getElementById('addAccount'); if(addAcc) addAcc.onclick=()=>{
    const overlay = document.createElement('div'); overlay.className='overlay';
    overlay.innerHTML = `<div class="modal"><h3>เพิ่มบัญชีพนักงาน</h3>
      <div class="field"><label>ชื่อ-นามสกุล</label><input id="acName"></div>
      <div class="field"><label>ชื่อผู้ใช้</label><input id="acUser"></div>
      <div class="field"><label>รหัสผ่าน</label><input id="acPass"></div>
      <div class="field"><label>บทบาท</label><select id="acRole">${Object.entries(ROLES).filter(([k])=> session.role==='owner' || k!=='owner').map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div>
      <div class="field" id="acStationField"><label>สถานีครัว (เฉพาะบทบาทครัว)</label><select id="acStation">${Object.entries(stationsMap()).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="modal-actions"><button class="btn btn-ghost" id="cancelAc">ยกเลิก</button><button class="btn btn-primary" id="saveAc">บันทึก</button></div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#cancelAc').onclick=()=>overlay.remove();
    overlay.querySelector('#saveAc').onclick=()=>{
      const username = overlay.querySelector('#acUser').value.trim();
      if(!username || !overlay.querySelector('#acPass').value){ toast('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
      if(state.staffAccounts.find(a=>a.username===username)){ toast('ชื่อผู้ใช้นี้มีอยู่แล้ว'); return; }
      const role = overlay.querySelector('#acRole').value;
      state.staffAccounts.push({ id:'u'+Date.now(), username, password:overlay.querySelector('#acPass').value, role,
        name:overlay.querySelector('#acName').value.trim()||username, station: role==='kitchen'? overlay.querySelector('#acStation').value : null });
      addAudit(`เพิ่มบัญชีพนักงาน: ${username}`); saveState(); overlay.remove(); renderView();
    };
  };
  document.querySelectorAll('[data-editacc]').forEach(b=>b.onclick=()=>openEditAccountModal(state.staffAccounts.find(a=>a.id===b.dataset.editacc)));
}
function openEditAccountModal(acc){
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `<div class="modal"><h3>แก้ไขบัญชี: ${acc.username}</h3>
    <div class="field"><label>ชื่อ-นามสกุล</label><input id="eaName" value="${acc.name}"></div>
    <div class="field"><label>บทบาท</label><select id="eaRole">${Object.entries(ROLES).filter(([k])=> session.role==='owner' || k!=='owner').map(([k,v])=>`<option value="${k}" ${acc.role===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="field" id="eaStationField"><label>สถานีครัว (เฉพาะบทบาทครัว)</label><select id="eaStation">${Object.entries(stationsMap()).map(([k,v])=>`<option value="${k}" ${acc.station===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)</label><input id="eaPass" type="password" placeholder="••••••"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cancelEa">ยกเลิก</button><button class="btn btn-primary" id="saveEa">บันทึก</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelEa').onclick = ()=>overlay.remove();
  overlay.querySelector('#saveEa').onclick = ()=>{
    const newRole = overlay.querySelector('#eaRole').value;
    if(acc.role==='owner' && newRole!=='owner'){
      const otherOwners = state.staffAccounts.filter(a=>a.role==='owner' && a.id!==acc.id).length;
      if(otherOwners===0){ toast('ต้องมีบัญชีเจ้าของร้านเหลืออย่างน้อย 1 บัญชี'); return; }
    }
    acc.name = overlay.querySelector('#eaName').value.trim() || acc.username;
    acc.role = newRole;
    acc.station = newRole==='kitchen' ? overlay.querySelector('#eaStation').value : null;
    const newPass = overlay.querySelector('#eaPass').value;
    if(newPass) acc.password = newPass;
    addAudit(`แก้ไขบัญชีพนักงาน ${acc.username} → บทบาท: ${ROLES[newRole].label}`);
    saveState(); overlay.remove(); renderView();
  };
}
